<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agrawal OMS - Store Billing & Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">⚙️ Agrawal Machinery Store - OMS</h1>
    <span class="text-sm bg-emerald-600 px-3 py-1 rounded">Persistent Database Connected</span>
  </header>

  <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- LEFT: BILLING & CHECKOUT SECTION -->
    <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-sm border">
      <h2 class="text-lg font-semibold mb-4 border-b pb-2">🧾 New Billing & Invoice</h2>
      
      <!-- Customer Info -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Customer Name</label>
          <input type="text" id="custName" placeholder="Enter customer name" class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="text" id="custPhone" placeholder="Enter phone number" class="w-full border p-2 rounded mt-1">
        </div>
      </div>

      <!-- Add Item to Invoice -->
      <div class="flex gap-2 mb-4">
        <select id="itemSelect" class="border p-2 rounded w-2/3">
          <option value="">Select Item / Service from Store Stock...</option>
        </select>
        <input type="number" id="itemQty" value="1" min="1" class="border p-2 rounded w-1/6" placeholder="Qty">
        <button onclick="addToBill()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-1/6">Add</button>
      </div>

      <!-- Cart Table -->
      <table class="w-full text-left border-collapse mb-4">
        <thead>
          <tr class="bg-gray-50 border-b text-sm text-gray-600">
            <th class="p-2">Item</th>
            <th class="p-2">Price</th>
            <th class="p-2">Qty</th>
            <th class="p-2">Total</th>
          </tr>
        </thead>
        <tbody id="cartTable">
          <!-- Cart items will appear here -->
        </tbody>
      </table>

      <!-- Billing Options (Discounts, Payment Type, EMI) -->
      <div class="bg-gray-50 p-4 rounded border grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium">Discount (₹)</label>
          <input type="number" id="discount" value="0" oninput="calculateTotal()" class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium">Payment Mode</label>
          <select id="paymentType" onchange="toggleEmi()" class="w-full border p-2 rounded mt-1">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI / GPay / PhonePe</option>
            <option value="Card">Credit / Debit Card</option>
            <option value="EMI">EMI / Consumer Finance</option>
          </select>
        </div>
      </div>

      <!-- EMI Options Box (Hidden by default) -->
      <div id="emiBox" class="hidden bg-amber-50 border border-amber-200 p-4 rounded mb-4">
        <h3 class="font-semibold text-amber-900 mb-2">💳 EMI Financing Setup</h3>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-xs">Finance Provider</label>
            <input type="text" id="emiProvider" value="Bajaj Finserv" class="w-full border p-1 text-sm rounded">
          </div>
          <div>
            <label class="text-xs">Down Payment (₹)</label>
            <input type="number" id="emiDownPayment" value="0" class="w-full border p-1 text-sm rounded">
          </div>
          <div>
            <label class="text-xs">Tenure (Months)</label>
            <input type="number" id="emiMonths" value="6" class="w-full border p-1 text-sm rounded">
          </div>
        </div>
      </div>

      <!-- Billing Totals Summary -->
      <div class="text-right space-y-1 text-sm border-t pt-2">
        <p>Subtotal: <span id="subtotalText">₹0.00</span></p>
        <p>GST (18%): <span id="gstText">₹0.00</span></p>
        <p class="text-xl font-bold text-emerald-700">Grand Total: <span id="grandTotalText">₹0.00</span></p>
      </div>

      <button onclick="saveAndPrintInvoice()" class="w-full mt-4 bg-emerald-600 text-white font-semibold py-3 rounded-lg hover:bg-emerald-700">
        💾 Save & Print Bill
      </button>
    </div>

    <!-- RIGHT: INVENTORY MANAGEMENT SECTION -->
    <div class="bg-white p-6 rounded-lg shadow-sm border">
      <h2 class="text-lg font-semibold mb-4 border-b pb-2">📦 Add Store Item / Stock</h2>
      
      <div class="space-y-3">
        <input type="text" id="newItemName" placeholder="Item Name (e.g. Apollo 10.00-20 Tire)" class="w-full border p-2 text-sm rounded">
        <select id="newItemCat" class="w-full border p-2 text-sm rounded">
          <option value="Tires">Tires & Tubes</option>
          <option value="Machinery">Machinery & Parts</option>
          <option value="Services">Services (Fitting/Balancing)</option>
        </select>
        <input type="text" id="newItemBrand" placeholder="Brand / Manufacturer" class="w-full border p-2 text-sm rounded">
        <input type="number" id="newItemPrice" placeholder="Price (₹)" class="w-full border p-2 text-sm rounded">
        <input type="number" id="newItemStock" placeholder="Stock Quantity" class="w-full border p-2 text-sm rounded">
        
        <button onclick="addNewStoreItem()" class="w-full bg-slate-800 text-white py-2 rounded text-sm hover:bg-slate-900">
          + Add Item to Available List
        </button>
      </div>

      <hr class="my-6">

      <h3 class="font-semibold text-sm mb-2">Available Store Stock</h3>
      <div id="stockList" class="space-y-2 max-h-60 overflow-y-auto text-xs">
        <!-- Stock items list -->
      </div>
    </div>

  </div>

  <script>
    let inventory = [];
    let cart = [];

    // Load items on initial launch
    async function loadInventory() {
      const res = await fetch('/api/inventory');
      inventory = await res.json();
      
      const select = document.getElementById('itemSelect');
      const stockList = document.getElementById('stockList');
      select.innerHTML = '<option value="">Select Item / Service from Store Stock...</option>';
      stockList.innerHTML = '';

      inventory.forEach(item => {
        select.innerHTML += `<option value="${item.id}">${item.name} (${item.brand || ''}) - ₹${item.price}</option>`;
        stockList.innerHTML += `
          <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
            <div>
              <p class="font-semibold">${item.name}</p>
              <p class="text-gray-500">₹${item.price} | Stock: ${item.stock}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-[10px] ${item.stock < 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
              ${item.stock < 5 ? 'Low Stock' : 'In Stock'}
            </span>
          </div>
        `;
      });
    }

    function addToBill() {
      const id = parseInt(document.getElementById('itemSelect').value);
      const qty = parseInt(document.getElementById('itemQty').value);
      if(!id || qty <= 0) return alert('Select an item and enter valid quantity');

      const item = inventory.find(i => i.id === id);
      cart.push({ ...item, qty, itemTotal: item.price * qty });
      renderCart();
    }

    function renderCart() {
      const tbody = document.getElementById('cartTable');
      tbody.innerHTML = '';
      cart.forEach((c, index) => {
        tbody.innerHTML += `
          <tr class="border-b text-sm">
            <td class="p-2">${c.name}</td>
            <td class="p-2">₹${c.price}</td>
            <td class="p-2">${c.qty}</td>
            <td class="p-2 font-semibold">₹${c.itemTotal}</td>
          </tr>
        `;
      });
      calculateTotal();
    }

    function calculateTotal() {
      const subtotal = cart.reduce((acc, c) => acc + c.itemTotal, 0);
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const discountedSubtotal = Math.max(0, subtotal - discount);
      const gst = discountedSubtotal * 0.18;
      const grandTotal = discountedSubtotal + gst;

      document.getElementById('subtotalText').innerText = `₹${subtotal.toFixed(2)}`;
      document.getElementById('gstText').innerText = `₹${gst.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `₹${grandTotal.toFixed(2)}`;
    }

    function toggleEmi() {
      const mode = document.getElementById('paymentType').value;
      const emiBox = document.getElementById('emiBox');
      emiBox.classList.toggle('hidden', mode !== 'EMI');
    }

    async function addNewStoreItem() {
      const name = document.getElementById('newItemName').value;
      const category = document.getElementById('newItemCat').value;
      const brand = document.getElementById('newItemBrand').value;
      const price = parseFloat(document.getElementById('newItemPrice').value);
      const stock = parseInt(document.getElementById('newItemStock').value);

      if(!name || !price) return alert("Please fill name and price.");

      await fetch('/api/inventory', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, category, brand, specs: '', price, stock })
      });

      alert('Item added successfully!');
      loadInventory();
    }

    async function saveAndPrintInvoice() {
      if(cart.length === 0) return alert('Cart is empty!');

      const customer_name = document.getElementById('custName').value || 'Walk-in Customer';
      const customer_phone = document.getElementById('custPhone').value || 'N/A';
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const subtotal = cart.reduce((acc, c) => acc + c.itemTotal, 0);
      const gst_amount = (subtotal - discount) * 0.18;
      const grand_total = (subtotal - discount) + gst_amount;
      const payment_type = document.getElementById('paymentType').value;

      let emi_details = null;
      if (payment_type === 'EMI') {
        const provider = document.getElementById('emiProvider').value;
        const downPayment = parseFloat(document.getElementById('emiDownPayment').value) || 0;
        const months = parseInt(document.getElementById('emiMonths').value) || 6;
        const monthlyEmi = (grand_total - downPayment) / months;
        emi_details = { provider, downPayment, months, monthlyEmi };
      }

      const res = await fetch('/api/invoices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_name, customer_phone, subtotal, discount, gst_amount, grand_total, payment_type, emi_details, items: cart
        })
      });

      if(res.ok) {
        alert('Invoice created & saved to local database!');
        window.print();
        cart = [];
        renderCart();
        loadInventory();
      }
    }

    loadInventory();
  </script>
</body>
</html>
