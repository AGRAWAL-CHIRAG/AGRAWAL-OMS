<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrawal OMS - Customer Directory</title>
  <style>
    :root {
      --bg-dark: #12181f;
      --card-bg: #1e2630;
      --border-color: #2e3a48;
      --gold-primary: #d4af37;
      --gold-hover: #f3e5ab;
      --text-main: #f0f4f8;
      --text-muted: #8c9ba5;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold-primary);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: var(--gold-primary);
    }

    .controls-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    select {
      background: #141b22;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--gold-primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #141b22;
      color: var(--gold-primary);
      padding: 12px;
      border-bottom: 2px solid var(--border-color);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:hover {
      background-color: rgba(212, 175, 55, 0.05);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge-upi { background: #1a3a2a; color: #52c41a; border: 1px solid #277c3e; }
    .badge-cash { background: #3a2e1a; color: #faad14; border: 1px solid #8c6411; }
    .badge-credit { background: #3a1a1a; color: #ff4d4f; border: 1px solid #8c2424; }
    .badge-card { background: #1a2e3a; color: #1890ff; border: 1px solid #11578c; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2>Agrawal OMS - Customer Directory</h2>
    <div style="color: var(--text-muted);">
      Total Customers: <strong id="recordCount" style="color: var(--gold-primary);">0</strong>
    </div>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <label for="paymentFilter">Filter by Payment Mode:</label>
      <select id="paymentFilter" onchange="fetchCustomers()">
        <option value="ALL">All Payment Types</option>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI / QR</option>
        <option value="Credit">Credit / Khata</option>
        <option value="Card">Card</option>
      </select>
    </div>

    <div class="control-group">
      <label for="sortBy">Sort By:</label>
      <select id="sortBy" onchange="fetchCustomers()">
        <option value="spent-desc">Highest Total Spent</option>
        <option value="spent-asc">Lowest Total Spent</option>
        <option value="orders-desc">Most Orders</option>
        <option value="balance-desc">Highest Pending Khata Balance</option>
        <option value="name-asc">Customer Name (A-Z)</option>
      </select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th>Payment Mode</th>
        <th>Total Orders</th>
        <th>Total Spent (₹)</th>
        <th>Pending Khata (₹)</th>
      </tr>
    </thead>
    <tbody id="customerTableBody">
      <!-- Data loaded via JS -->
    </tbody>
  </table>
</div>

<script>
  async function fetchCustomers() {
    const payment = document.getElementById('paymentFilter').value;
    const sort = document.getElementById('sortBy').value;

    try {
      const response = await fetch(`/api/customers?payment_type=${payment}&sort_by=${sort}`);
      const data = await response.json();

      const tbody = document.getElementById('customerTableBody');
      document.getElementById('recordCount').innerText = data.length;
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No records found.</td></tr>`;
        return;
      }

      data.forEach(c => {
        const paymentType = c.payment_type || 'Cash';
        const badgeClass = `badge badge-${paymentType.toLowerCase()}`;
        const balanceColor = c.outstanding_balance > 0 ? '#ff4d4f' : 'inherit';

        const row = `
          <tr>
            <td>${c.customer_id}</td>
            <td><strong>${c.customer_name}</strong></td>
            <td>${c.phone || 'N/A'}</td>
            <td><span class="${badgeClass}">${paymentType}</span></td>
            <td>${c.total_orders}</td>
            <td style="color: var(--gold-primary); font-weight: bold;">₹${Number(c.total_spent).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td style="color: ${balanceColor}; font-weight: bold;">₹${Number(c.outstanding_balance).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    } catch (error) {
      console.error('Error fetching customers:', error);
    }
  }

  // Load data on page launch
  fetchCustomers();
</script>

</body>
</html>
